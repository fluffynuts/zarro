version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # faker 10 is ESM-only; jest + ts-jest here run as CommonJS
      - dependency-name: "@faker-js/faker"
        update-types: ["version-update:semver-major"]
      # ts-jest peer range is typescript <7; its compiler-API use breaks on TS 7
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # through2 5 is ESM-only (import-only "exports"); this project is CommonJS
      - dependency-name: "through2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/through2"
        update-types: ["version-update:semver-major"]
      # gulp-msbuild 0.11.1 to 0.11.3 require uuid at runtime but only declare it as a dev
      # dependency; zarro therefore depends on uuid directly so they load.
      # 1.0.x depends on the npm "node" package (which its code never imports); that
      # installs a node binary into node_modules/.bin and shadows the user's node.
      # Ignoring exactly those releases means a PR appears once a fixed release is
      # published. zarro itself is pinned in package.json.
      - dependency-name: "gulp-msbuild"
        versions: ["1.0.0", "1.0.1", "1.0.2", "1.0.3"]
