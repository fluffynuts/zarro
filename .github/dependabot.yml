version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # faker 10 is ESM-only; jest + ts-jest here run as CommonJS
      - dependency-name: "@faker-js/faker"
        update-types: ["version-update:semver-major"]
      # ts-jest peer range is typescript <7; its compiler-API use breaks on TS 7
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # through2 5 is ESM-only (import-only "exports"); this project is CommonJS
      - dependency-name: "through2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/through2"
        update-types: ["version-update:semver-major"]
      # gulp-msbuild 1.0.x depends on the npm "node" package (which its code never
      # imports); that installs a node binary into node_modules/.bin and shadows
      # the user's node. Ignoring exactly those releases means a new PR appears once a
      # release without that dependency is published, and the 0.11.x line (which
      # dropped uuid in 0.11.3) keeps flowing. zarro itself is pinned in package.json.
      - dependency-name: "gulp-msbuild"
        versions: ["1.0.0", "1.0.1", "1.0.2", "1.0.3"]
