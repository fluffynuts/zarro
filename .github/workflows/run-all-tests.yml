name: Tests

on:
  push:
    branches: [  ]
  pull_request:
    branches: [ master ]

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup .NET for integration testing
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          7.0.306

    - name: 🟢 Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: ⬆️ Fetch latest software lists
      run: |
        sudo apt update -q

    - name: 🟥 Setup Redis for test locks
      run: |
        sudo apt install redis-server -q

    - name: 🟦 Setup mono to run nuget.exe
      run: |
        sudo apt install mono-complete -q -y

    - name: 🔎 Verify test prerequisites (redis for locks, mono for nuget.exe)
      run: |
        sudo systemctl start redis-server
        redis-cli ping
        mono --version

    - name: Test
      env:
        SUPPRESS_DOWNLOAD_PROGRESS: 1
        RUNNING_IN_GITHUB_ACTION: 1
        TEST_TIMEOUT: 60000
        MAX_WORKERS: 1
      run: |
        npm i
        npm run build
        npm test
